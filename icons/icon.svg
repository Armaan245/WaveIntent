<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#00B8D9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)" stroke="#222736" stroke-width="2"/>
  <circle cx="64" cy="64" r="42" fill="none" stroke="#00FFA3" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <!-- Microphone & Waveform Symbol -->
  <path d="M56 46 A8 8 0 0 1 72 46 V62 A8 8 0 0 1 56 62 Z" fill="url(#mintGrad)" filter="url(#glow)"/>
  <path d="M48 58 A16 16 0 0 0 80 58" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="74" x2="64" y2="86" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="52" y1="86" x2="76" y2="86" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Magic sparkle / Disney star -->
  <polygon points="90,32 93,40 101,43 93,46 90,54 87,46 79,43 87,40" fill="#FFDF00" filter="url(#glow)"/>
  <circle cx="34" cy="38" r="2.5" fill="#00FFA3" filter="url(#glow)"/>
  <circle cx="96" cy="80" r="2" fill="#FFFFFF"/>
</svg>
